<!DOCTYPE html>
<html lang="ro">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles.css">
<script src="script.js" defer></script>

</head>

<body>

<div class="container">

<textarea id="initialPrompt" style="display:none;">
Ești un profesor prietenos de limba română.
Vorbești cu un elev din clasa a V-a.

Folosește propoziții simple și clare, potrivite pentru vârsta elevului.

Pune întrebări scurte în limba română.
Ascultă răspunsurile elevului și corectează
cu blândețe greșelile lui.

Explică lucrurile pe înțelesul unui copil din clasa a V-a.

Continuă conversația în limba română.
</textarea>

Învățăm limba română!
<div class=" spacer"></div>
<textarea id="textInput" placeholder="Aici veți vedea textul rostit de Dumneavoastră"></textarea>
<div class=" spacer"></div>
<button id="sendButton" onclick="speech()">Doriți să spuneți ceva? Apăsați aici - și vorbiți</button>
<div class=" spacer"></div>
<textarea id="textOutput" placeholder="Aici veți vedea răspunsul pronunțat de Inteligența Artificială (IA)"></textarea>
<div class=" spacer"></div>
<button onclick="repeatLast()">Doriți să ascultați încă o dată răspunsul pronunțat de IA - apăsați aici</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

</body>
</html>
