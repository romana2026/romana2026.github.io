</head>

<body>

<div class="container">

<div class="classSelector">

    <option value="2">Clasa 2</option>
    <option value="3">Clasa 3</option>
    <option value="4">Clasa 4</option>
    <option value="5" selected>Clasa 5</option>
    <option value="6">Clasa 6</option>
    <option value="7">Clasa 7</option>
    <option value="8">Clasa 8</option>
    <option value="9">Clasa 9</option>
    <option value="10">Clasa 10</option>
    <option value="11">Clasa 11</option>
    <option value="12">Clasa 12</option>
  </select>
</div>

Învățăm limba română!
<div class=" spacer"></div>
<textarea id="textInput" placeholder="Aici veți vedea textul rostit de Dumneavoastră"></textarea>
<div class=" spacer"></div>
<button id="sendButton" onclick="speech()">Doriți să spuneți ceva? Apăsați aici - și vorbiți</button>
<div class=" spacer"></div>
<textarea id="textOutput" placeholder="Aici veți vedea răspunsul pronunțat de Inteligența Artificială (IA)"></textarea>
<div class=" spacer"></div>
<button onclick="repeatLast()">Doriți să ascultați încă o dată răspunsul pronunțat de IA - apăsați aici</button>
</div>
